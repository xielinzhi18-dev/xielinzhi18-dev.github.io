name: Publish personal website trial

on:
  push:
    branches: [main]
    paths: [site-public.zip, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.repository == 'xielinzhi18-dev/xielinzhi18-dev.github.io'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Unpack checked public website
        run: |
          python3 -m zipfile -t site-public.zip
          python3 -m zipfile -e site-public.zip _site
          test -f _site/zh/index.html
          test -f _site/en/index.html
          test -f _site/.nojekyll
          grep -q 'xielinzhi18-dev.github.io' _site/sitemap.xml
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
